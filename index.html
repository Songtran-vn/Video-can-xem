<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thư viện video</title><meta name="description" content="Thư viện video học tập"><link rel="stylesheet" href="/styles.css"></head><body>
<header><div class="brand"><span class="logo">▶</span><div><h1>Thư viện video</h1><p>Chọn video · Xem và học ngay</p></div></div><div class="stats"><span><b id="total">0</b> video</span><span><b id="watched">0</b> đã xem</span></div></header>
<main><aside><section class="card list-card"><div class="list-head"><div><h2>Danh sách video</h2><small id="count">0</small></div><input id="search" placeholder="⌕  Tìm video..."><div class="filters"><button class="active" data-filter="all">Tất cả</button><button data-filter="unwatched">Chưa xem</button><button data-filter="watched">Đã xem</button></div></div><div id="videoList" class="video-list"><div class="empty">Đang tải video...</div></div></section></aside><section id="workspace" class="workspace"></section></main>
<script src="/app.js"></script></body></html>
